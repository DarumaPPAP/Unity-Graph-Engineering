$schema: "https://json-schema.org/draft/2020-12/schema"
title: Unity Graph Execution Orchestration Result
type: object
required: [schema_version, controller, operation, status, ready_for_execution, diagnostics, authority]
properties:
  schema_version:
    type: string
  controller:
    const: execution_orchestrator
  operation:
    enum: [prepare, finalize]
  status:
    enum: [ok, blocked, invalid_request]
  ready_for_execution:
    type: boolean
  decision:
    type: [object, "null"]
  claim:
    type: [object, "null"]
  memory:
    type: [object, "null"]
  code_intelligence:
    type: [object, "null"]
  source_verification:
    type: [object, "null"]
    properties:
      completed:
        type: boolean
      required:
        type: boolean
      scope_class:
        enum: [project_internal, portable_artifact, public_reference]
      paths:
        type: array
        items:
          type: string
      evidence_refs:
        type: array
        items:
          type: string
    additionalProperties: false
  ticket:
    type: [object, "null"]
    required:
      - schema_version
      - goal_id
      - selected_todo_id
      - worker_id
      - execution_profile
      - work_kind
      - state_fingerprint
      - source_verification
      - ticket_id
      - ticket_digest
    properties:
      schema_version:
        type: string
      goal_id:
        type: string
        minLength: 1
      selected_todo_id:
        type: string
        minLength: 1
      worker_id:
        type: string
        minLength: 1
      execution_profile:
        enum: [generic_planning, personal_full_control, team_safe_import]
      work_kind:
        enum: [mutation, verification, analysis]
      state_fingerprint:
        type: string
        pattern: "^[a-f0-9]{64}$"
      source_verification:
        type: object
        required: [completed, scope_class, paths, evidence_refs]
        properties:
          completed:
            type: boolean
          scope_class:
            enum: [project_internal, portable_artifact, public_reference]
          paths:
            type: array
            items:
              type: string
          evidence_refs:
            type: array
            items:
              type: string
        additionalProperties: false
      ticket_id:
        type: string
        pattern: "^ticket-[a-f0-9]{24}$"
      ticket_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
    allOf:
      - if:
          properties:
            work_kind:
              const: mutation
        then:
          properties:
            source_verification:
              properties:
                completed:
                  const: true
                paths:
                  minItems: 1
                evidence_refs:
                  minItems: 1
    additionalProperties: false
  evidence:
    type: [object, "null"]
  atom:
    type: [object, "null"]
  quota:
    type: [object, "null"]
  required_state_writeback:
    type: [object, "null"]
    properties:
      todo_id:
        type: string
      claim:
        type: object
      previous_slice:
        type: object
        properties:
          slice_id:
            type: string
          todo_id:
            type: string
          writeback_complete:
            const: true
          validated:
            const: true
          evidence_refs:
            type: array
            minItems: 1
            items:
              type: string
          quota_spent:
            const: true
          quota_spend_id:
            type: string
            pattern: "^spend-[a-f0-9]{24}$"
          orchestrated:
            const: true
        additionalProperties: false
      quota:
        type: object
        properties:
          spent_slots:
            type: [integer, "null"]
            minimum: 0
        additionalProperties: false
      orchestration:
        type: object
        properties:
          active_ticket_id:
            type: [string, "null"]
          last_quota_spend_id:
            type: string
            pattern: "^spend-[a-f0-9]{24}$"
          required_next_action:
            type: string
          last_status:
            enum: [ok, blocked, invalid_request]
        additionalProperties: false
      memory_projection:
        type: object
        properties:
          memory_ids:
            type: array
            items:
              type: string
          raw_evidence_refs:
            type: array
            items:
              type: string
        additionalProperties: false
    additionalProperties: false
  required_next_action:
    type: [string, "null"]
  diagnostics:
    type: array
    items:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: true
  authority:
    type: object
    required:
      - owns_source_mutation
      - owns_state_current
      - owns_human_gate
      - owns_quota_policy
      - coordinates_controllers
    properties:
      owns_source_mutation:
        const: false
      owns_state_current:
        const: false
      owns_human_gate:
        const: false
      owns_quota_policy:
        const: false
      coordinates_controllers:
        const: true
    additionalProperties: false
allOf:
  - if:
      properties:
        operation:
          const: prepare
        ready_for_execution:
          const: true
    then:
      required: [ticket, decision, source_verification]
      properties:
        ticket:
          type: object
  - if:
      properties:
        operation:
          const: finalize
        status:
          const: ok
    then:
      required: [evidence, quota]
additionalProperties: false
