$schema: "https://json-schema.org/draft/2020-12/schema"
title: UnityAgent to Unity Graph Engineering Handoff v2
type: object
required:
  - schema_version
  - task_id
  - context_manifest_id
  - context_manifest_schema_version
  - route_id
  - task_fingerprint
  - task_contract_ref
  - execution_profile
  - risk_level
  - selected_contexts
  - context_budget_decision
  - allowed_mutations
  - prohibited_mutations
  - required_quality_gates
  - conditional_quality_gates
  - unresolved_bindings
properties:
  schema_version:
    const: "2.0"
  task_id:
    type: string
    minLength: 1
  context_manifest_id:
    type: string
    minLength: 1
  context_manifest_schema_version:
    type: string
    minLength: 1
  route_id:
    type: string
    minLength: 1
  task_fingerprint:
    type: object
    required:
      - intent
      - artifact
      - scope
      - failure_mode
      - architecture_state
      - mutation_target
      - evidence_state
      - project_access
    properties:
      intent: {}
      artifact: {}
      scope: {}
      failure_mode: {}
      architecture_state: {}
      mutation_target: {}
      evidence_state: {}
      project_access: {}
    additionalProperties: true
  task_contract_ref:
    type: string
    minLength: 1
  execution_profile:
    enum:
      - generic_planning
      - personal_full_control
      - team_safe_import
  risk_level:
    type: string
    pattern: "^R[0-9]+$"
  selected_contexts:
    type: array
    items:
      type: object
      required: [id, source_hash]
      properties:
        id:
          type: string
          minLength: 1
        source_hash:
          type: [string, "null"]
      additionalProperties: false
  context_budget_decision:
    type: object
    required: [contract, profile, decision, blocking_reasons]
    properties:
      contract:
        const: .ai/context-budget.yaml
      profile:
        type: string
        minLength: 1
      decision:
        enum:
          - within_budget
          - compression_required
          - blocked
          - unmeasured
      blocking_reasons:
        type: array
        items:
          type: string
    additionalProperties: false
  allowed_mutations:
    type: array
    items:
      type: string
  prohibited_mutations:
    type: array
    items:
      type: string
  required_quality_gates:
    type: array
    items:
      type: string
      minLength: 1
  conditional_quality_gates:
    type: array
    items:
      type: string
      minLength: 1
  unresolved_bindings:
    type: array
allOf:
  - if:
      properties:
        allowed_mutations:
          minItems: 1
      required: [allowed_mutations]
    then:
      properties:
        context_budget_decision:
          properties:
            decision:
              const: within_budget
additionalProperties: false
