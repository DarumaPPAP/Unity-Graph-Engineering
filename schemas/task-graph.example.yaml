schema_version: "1.0"
id: fakeunity7-rendering-feature
name: FakeUnity7 Rendering Feature Pilot
readiness: L2_assisted
trigger:
  - implement a URP rendering feature in FakeUnity7
required_context:
  - AGENTS.md
  - PROJECT_CONTEXT.md
  - STATE.md
budgets:
  max_parallel_workers: 3
  max_attempts_per_action_node: 3
nodes:
  - id: compile-goal
    role: goal-compiler
    purpose: Define the rendering result and evidence required.
    outputs:
      - goal-contract.json

  - id: inspect-project
    role: repository-researcher
    purpose: Inspect FakeUnity7 renderer, shaders, settings, and conventions.
    depends_on:
      - compile-goal
    mode: read_only
    outputs:
      - repository-context.md

  - id: inspect-unity-api
    role: unity-api-researcher
    purpose: Verify version-sensitive URP APIs against official sources.
    depends_on:
      - compile-goal
    mode: read_only
    outputs:
      - api-evidence.md

  - id: plan-change
    role: plan-owner
    purpose: Assign writer ownership and define compile, visual, and performance checks.
    depends_on:
      - inspect-project
      - inspect-unity-api
    outputs:
      - task-plan.yaml

  - id: implement
    role: rendering-worker
    purpose: Implement the approved minimal change.
    depends_on:
      - plan-change
    loop:
      action: edit owned rendering artifacts
      observe:
        - Unity compile
        - fixed-camera capture
      evaluate_by: independent-rendering-verifier
      max_attempts: 3
    outputs:
      - source diff
      - maker evidence

  - id: verify
    role: independent-rendering-verifier
    purpose: Validate compile, pass behavior, visual result, and regressions.
    depends_on:
      - implement
    verdicts:
      - APPROVE
      - REJECT
      - ESCALATE_HUMAN
    outputs:
      - verification-evidence.json

  - id: human-gate
    role: human
    purpose: Approve merge and project-level changes.
    depends_on:
      - verify

  - id: write-state
    role: state-writer
    purpose: Persist outcome and reusable facts.
    depends_on:
      - human-gate
completion:
  - verifier approves all required criteria
  - human gate is resolved
  - STATE.md is updated
