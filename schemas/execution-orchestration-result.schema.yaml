$schema: "https://json-schema.org/draft/2020-12/schema"
title: Unity Graph Execution Orchestration Runtime Result
type: object
required:
  - schema_version
  - controller
  - operation
  - status
  - ready_for_execution
  - diagnostics
  - authority
properties:
  schema_version:
    type: string
  controller:
    const: execution_orchestrator
  operation:
    enum: [prepare, finalize]
  status:
    enum: [ok, blocked, invalid_request]
  ready_for_execution:
    type: boolean
  decision:
    type: [object, "null"]
  claim:
    type: [object, "null"]
  memory:
    type: [object, "null"]
  code_intelligence:
    type: [object, "null"]
  source_verification:
    oneOf:
      - type: "null"
      - $ref: "#/$defs/source_verification_result"
  ticket:
    oneOf:
      - type: "null"
      - $ref: "execution-ticket.schema.yaml"
  evidence:
    type: [object, "null"]
  atom:
    type: [object, "null"]
  quota:
    type: [object, "null"]
  required_state_writeback:
    type: [object, "null"]
    properties:
      todo_id:
        type: string
      claim:
        type: object
      previous_slice:
        type: object
        properties:
          slice_id: {type: string}
          todo_id: {type: string}
          writeback_complete: {const: true}
          validated: {const: true}
          evidence_refs:
            type: array
            minItems: 1
            items: {type: string}
          quota_spent: {const: true}
          quota_spend_id:
            type: string
            pattern: "^spend-[a-f0-9]{24}$"
          orchestrated: {const: true}
        additionalProperties: false
      quota:
        type: object
        properties:
          spent_slots:
            type: [integer, "null"]
            minimum: 0
        additionalProperties: false
      orchestration:
        type: object
        properties:
          active_ticket_id:
            type: [string, "null"]
          last_quota_spend_id:
            type: string
            pattern: "^spend-[a-f0-9]{24}$"
          required_next_action:
            type: string
          last_status:
            enum: [ok, blocked, invalid_request]
        additionalProperties: false
      memory_projection:
        type: object
        properties:
          memory_ids:
            type: array
            items: {type: string}
          raw_evidence_refs:
            type: array
            items: {type: string}
        additionalProperties: false
    additionalProperties: false
  required_next_action:
    type: [string, "null"]
  diagnostics:
    type: array
    items:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
      additionalProperties: true
  authority:
    type: object
    required:
      - owns_source_mutation
      - owns_state_current
      - owns_human_gate
      - owns_quota_policy
      - coordinates_controllers
    properties:
      owns_source_mutation: {const: false}
      owns_state_current: {const: false}
      owns_human_gate: {const: false}
      owns_quota_policy: {const: false}
      coordinates_controllers: {const: true}
    additionalProperties: false
allOf:
  - if:
      properties:
        operation: {const: prepare}
        ready_for_execution: {const: true}
      required: [operation, ready_for_execution]
    then:
      required: [decision, source_verification, ticket]
      properties:
        source_verification:
          $ref: "#/$defs/source_verification_result"
        ticket:
          $ref: "execution-ticket.schema.yaml"
  - if:
      properties:
        operation: {const: finalize}
        status: {const: ok}
      required: [operation, status]
    then:
      required: [evidence, quota]
additionalProperties: false
$defs:
  source_verification_result:
    type: object
    required: [completed, required, scope_class, paths, evidence_refs]
    properties:
      completed: {type: boolean}
      required: {type: boolean}
      scope_class:
        enum: [project_internal, portable_artifact, public_reference]
      paths:
        type: array
        items: {type: string}
      evidence_refs:
        type: array
        items: {type: string}
    additionalProperties: false
