schema_version: "1.0"
inspired_by: huangruiteng/loopx
authority: Unity-Graph-Engineering native contract
external_runtime_required: false

purpose:
  - decide whether another bounded graph slice may run
  - preserve typed next work across turns
  - separate scheduling quota from permission and budget

terms:
  gate: permission_or_safety_boundary
  budget: maximum_resource_consumption
  quota: continuation_or_scheduling_share

invariants:
  quota_is_permission: false
  budget_is_permission: false
  human_gate_can_never_be_bypassed_by_quota: true
  continuation_requires_valid_writeback: true
  one_writer_per_artifact: true
  unbounded_autonomy_forbidden: true

state_order:
  - health_gate
  - human_gate
  - evidence_wait
  - focus_wait
  - compute_quota
  - bounded_work

continuation_decisions:
  run:
    requires:
      - no_blocking_gate
      - todo_available
      - budget_remaining
      - quota_eligible
  ask_human:
    terminal_for_automatic_continuation: true
  wait:
    terminal_for_current_slice: true
  blocked:
    terminal_for_current_slice: true
  complete:
    terminal_for_goal: true

bounded_slice:
  unit: one_node_or_one_verification_slice
  must_write:
    - result_summary
    - evidence_refs
    - next_todo_or_completion
    - budget_delta
  failed_slice_must_write_blocker: true

quota:
  enabled_for_graph_loop: true
  default_compute_share: 1.0
  minimum: 0.0
  maximum: 1.0
  spend_only_after_validated_slice: true
  quota_zero_means_automatic_continuation_paused: true
  quota_zero_does_not_delete_goal: true
  exact_token_accounting_required: false

claims_and_leases:
  claim_required_when_multiple_workers_can_select_same_todo: true
  lease_is_execution_local: true
  lease_must_not_override_human_gate: true
  expired_lease_returns_todo_to_unclaimed: true

writeback:
  execution_state_source: STATE/current.yaml
  append_only_event_source: STATE/events.jsonl
  evidence_source: Evidence/
  transcript_is_not_state: true
  required_before_next_slice: true

safe_fallback:
  provider_unavailable:
    - continue_with_native_state
    - keep_quota_at_policy_default
  evidence_missing:
    - do_not_spend_quota
    - mark_slice_unverified
