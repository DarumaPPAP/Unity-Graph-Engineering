name: Validate Execution Contracts

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "policies/**"
      - "schemas/**"
      - "skills/unity-execution-router/**"
      - "skills/unity-prompt-execution/**"
      - "skills/unity-graph-engineering/**"
      - "Tools/ExecutionPolicyValidator/**"
      - "Tools/UnityAgentCompatibility/**"
      - "Tools/BehaviorEvalAdapter/**"
      - "Tools/IxAdapter/**"
      - "Tools/ContinuationController/**"
      - "Tools/LayeredMemoryController/**"
      - "Tools/ExecutionOrchestrator/**"
      - "Tests/**"
      - "tests/**"
      - "workflows/**"
      - "workflow-templates/**"
      - "docs/**"
      - "examples/**"
      - ".github/workflows/validate-execution-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "README.md"
      - "policies/**"
      - "schemas/**"
      - "skills/unity-execution-router/**"
      - "skills/unity-prompt-execution/**"
      - "skills/unity-graph-engineering/**"
      - "Tools/ExecutionPolicyValidator/**"
      - "Tools/UnityAgentCompatibility/**"
      - "Tools/BehaviorEvalAdapter/**"
      - "Tools/IxAdapter/**"
      - "Tools/ContinuationController/**"
      - "Tools/LayeredMemoryController/**"
      - "Tools/ExecutionOrchestrator/**"
      - "Tests/**"
      - "tests/**"
      - "workflows/**"
      - "workflow-templates/**"
      - "docs/**"
      - "examples/**"
      - ".github/workflows/validate-execution-contracts.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Compile Python control plane
        run: python -m compileall -q Tools Tests

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          roots = [Path('policies'), Path('schemas'), Path('workflows'), Path('workflow-templates'), Path('tests'), Path('Tests')]
          paths = []
          for root in roots:
              if root.exists():
                  paths.extend(sorted(root.rglob('*.yaml')))
          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'validated yaml: {path}')
          PY

      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator

          for path in sorted(Path('schemas').glob('*.yaml')):
              with path.open(encoding='utf-8') as stream:
                  schema = yaml.safe_load(stream)
              Draft202012Validator.check_schema(schema)
              print(f'validated schema: {path}')
          PY

      - name: Validate execution policy coherence
        run: python Tools/ExecutionPolicyValidator/validate_execution_policies.py

      - name: Test external intelligence and control-plane contracts
        run: python -m unittest discover -s Tests/ExternalProviders -p "test_*.py" -v

      - name: Test UnityAgent compatibility contracts
        run: python -m unittest discover -s Tests/UnityAgentCompatibility -p "test_*.py" -v

      - name: Test Actual Behavior adapter contracts
        run: python -m unittest discover -s Tests/BehaviorEvalAdapter -p "test_*.py" -v

      - name: Assert required contract files
        run: |
          test -f policies/contract-routing.yaml
          test -f policies/evidence-admission.yaml
          test -f policies/external-providers.yaml
          test -f policies/continuation-control.yaml
          test -f policies/memory-layering.yaml
          test -f policies/execution-orchestration.yaml
          test -f policies/unityagent-compatibility.yaml
          test -f schemas/capability-manifest.schema.yaml
          test -f schemas/execution-state.schema.yaml
          test -f schemas/continuation-state.schema.yaml
          test -f schemas/memory-layer.schema.yaml
          test -f schemas/execution-orchestration.schema.yaml
          test -f schemas/unityagent-handoff-v2.schema.yaml
          test -f workflow-templates/verified-mutation.yaml
          test -f tests/contract-routing-cases.yaml
          test -f Tests/ExternalProviders/cases.yaml
          test -f Tests/ExternalProviders/test_ix_adapter.py
          test -f Tests/ExternalProviders/test_continuation_controller.py
          test -f Tests/ExternalProviders/test_layered_memory_controller.py
          test -f Tests/ExternalProviders/test_execution_orchestrator.py
          test -f Tests/UnityAgentCompatibility/test_handoff_adapter.py
          test -f Tests/BehaviorEvalAdapter/test_behavior_eval_adapter.py
          test -f Tools/UnityAgentCompatibility/handoff_adapter.py
          test -f Tools/BehaviorEvalAdapter/behavior_eval_adapter.py
          test -f Tools/IxAdapter/ix_adapter.py
          test -f Tools/ContinuationController/continuation_controller.py
          test -f Tools/LayeredMemoryController/layered_memory_controller.py
          test -f Tools/ExecutionOrchestrator/execution_orchestrator.py
          test -f docs/external-intelligence-control-plane.md
          test -f examples/continuation-controller-input.json
          test -f examples/layered-memory-capture.json
